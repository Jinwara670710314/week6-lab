services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: moviehub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - moviehub_pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d moviehub"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 2s

volumes:
  moviehub_pgdata:
